name: deploy

# Two modes (infra/DEPLOY.md):
#   inspect — READ-ONLY survey of the server over SSH (manual run only; changes
#             nothing; works without DEPLOY_ENABLED). The default of a manual run.
#   deploy  — builds the server and web images, publishes them to GHCR and deploys
#             them over SSH: idempotent bootstrap that leaves other software on the
#             server alone, migrations, `docker compose up`, smoke test, rollback.
# Safety switch: deploy never runs until the repository variable DEPLOY_ENABLED is
# "true" (the server may already run other software). Without the secrets every run
# is skipped (green), so forks and fresh clones are not affected.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = read-only survey of the server; deploy = install / update Datascratch"
        type: choice
        options: [inspect, deploy]
        default: inspect
      diag_docs:
        description: "inspect only: agent-mode document ids to check item by item (space-separated; metadata only)"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - apps/server/**
      - apps/web/**
      - packages/**
      - infra/**
      - pnpm-lock.yaml
      - .github/workflows/deploy.yml

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  secrets:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    outputs:
      inspect: ${{ steps.check.outputs.inspect }}
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ENABLED: ${{ vars.DEPLOY_ENABLED }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          missing=()
          [ -n "$HOST" ] || missing+=(DEPLOY_HOST)
          [ -n "$KEY" ] || missing+=(DEPLOY_SSH_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "inspect=false" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::Missing secrets: ${missing[*]}. See infra/DEPLOY.md."
            exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$MODE" = inspect ]; then
            echo "inspect=true" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "inspect=false" >> "$GITHUB_OUTPUT"
          # Safety switch: nothing touches the server until the repository variable
          # DEPLOY_ENABLED is "true" (the VPS may run other software; see infra/DEPLOY.md).
          if [ "$ENABLED" != "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy disabled::Set the repository variable DEPLOY_ENABLED=true to deploy. See infra/DEPLOY.md."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  inspect:
    name: Inspect the server (read-only)
    needs: secrets
    if: needs.secrets.outputs.inspect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key and host key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: infra/deploy/ssh-setup.sh
      # The repository is public, so its run logs are too: the survey must not print server
      # details (ports, processes, addresses, device and grant activity) into them. Disabled
      # until its output is encrypted to the owner (security audit 2026-10-27).
      - name: Survey (disabled in the public repository)
        run: |
          echo "::error::Inspect mode is disabled: its output would be public in this repository's Actions logs. Run infra/deploy/remote.sh inspect from the owner's own terminal instead."
          exit 1

  images:
    name: Build and publish images
    needs: secrets
    if: needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      server: ${{ steps.names.outputs.server }}
      web: ${{ steps.names.outputs.web }}
      postgres: ${{ steps.names.outputs.postgres }}
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "server=ghcr.io/$owner/datascratch-server"
            echo "web=ghcr.io/$owner/datascratch-web"
            echo "postgres=ghcr.io/$owner/datascratch-postgres:16-alpine"
            echo "tag=${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The server never pulls from Docker Hub (it can be unreachable from the VPS's
      # region): third-party base images are copied to GHCR here, on GitHub's side.
      - name: Mirror PostgreSQL to GHCR
        run: docker buildx imagetools create -t "${{ steps.names.outputs.postgres }}" docker.io/library/postgres:16-alpine
      - name: Server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.server }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.server }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Web image (web app + Caddy)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/deploy/web.Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.web }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.web }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to the server
    needs: [secrets, images]
    if: needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DS_TAG: ${{ needs.images.outputs.tag }}
      DS_SERVER_IMAGE: ${{ needs.images.outputs.server }}
      DS_WEB_IMAGE: ${{ needs.images.outputs.web }}
      DS_POSTGRES_IMAGE: ${{ needs.images.outputs.postgres }}
      # Coexistence with other software on the server (infra/DEPLOY.md):
      # auto | standalone | behind-proxy (Sinhron's Caddy if present, else any proxy).
      DS_DEPLOY_MODE: ${{ vars.DEPLOY_MODE || 'auto' }}
      DS_PROXY_PORT: ${{ vars.DS_PROXY_PORT || '8480' }}
      DS_NGINX_AUTO: ${{ vars.DS_NGINX_AUTO || 'false' }}
      DS_NGINX_CERTBOT: ${{ vars.DS_NGINX_CERTBOT || 'false' }}
      DS_HOST_MODE: ${{ vars.DS_HOST_MODE || 'auto' }}
      DS_MEM_PROFILE: ${{ vars.DS_MEM_PROFILE || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: SSH key and host key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          # Deploying needs a pinned host key; trust-on-first-use is for the read-only inspect only.
          REQUIRE_KNOWN_HOSTS: "1"
        run: infra/deploy/ssh-setup.sh

      - name: Address
        env:
          DOMAIN: ${{ vars.DS_DOMAIN }}
        run: |
          if [ -n "$DOMAIN" ]; then
            domain="$DOMAIN"
          else
            ip="$DEPLOY_HOST"
            if ! [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              ip="$(getent ahostsv4 "$DEPLOY_HOST" | awk 'NR==1{print $1}')"
            fi
            [ -n "$ip" ] || { echo "::error::Cannot resolve $DEPLOY_HOST to an IPv4 address; set the DS_DOMAIN variable."; exit 1; }
            # <ip-with-dashes>.sslip.io resolves to the IP itself; it gets a real certificate.
            domain="${ip//./-}.sslip.io"
          fi
          echo "DS_DOMAIN=$domain" >> "$GITHUB_ENV"
          echo "Deploying to https://$domain"

      - name: Bootstrap and deploy
        env:
          DS_REGISTRY_USER: ${{ github.actor }}
          DS_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          infra/deploy/remote.sh deploy
          # Only these keys with plain values may reach $GITHUB_ENV (the server's answer is not trusted).
          infra/deploy/remote.sh info | grep -E '^DS_(MODE|DOMAIN|PROXY_PORT|TAG)=[A-Za-z0-9._:-]*$' | tee -a "$GITHUB_ENV"

      - name: Smoke test
        id: smoke
        run: |
          if [ "$DS_MODE" = proxy ]; then
            # Behind the server's own proxy: check Datascratch itself through an SSH tunnel;
            # the public address works once the proxy is connected (see the summary).
            infra/deploy/remote.sh smoke-local
          elif [ "$DS_MODE" = edge ]; then
            # Behind the other app's Caddy: first Datascratch itself, then the public address.
            infra/deploy/remote.sh check
            node infra/deploy/smoke.mjs "https://$DS_DOMAIN" 300 || {
              echo "::error title=Public address::Datascratch runs, but https://$DS_DOMAIN does not answer through the other app's Caddy (certificate or DNS?). It is not rolled back."
              echo "public_failed=true" >> "$GITHUB_OUTPUT"
              exit 1
            }
          else
            node infra/deploy/smoke.mjs "https://$DS_DOMAIN" 300
          fi

      - name: Public address
        id: public
        if: env.DS_MODE == 'proxy'
        continue-on-error: true
        run: node infra/deploy/smoke.mjs "https://$DS_DOMAIN" 30

      - name: Roll back on failure
        if: failure() && steps.smoke.outcome == 'failure' && steps.smoke.outputs.public_failed != 'true'
        run: infra/deploy/remote.sh rollback

      - name: Summary
        if: always()
        env:
          IOS_URL: ${{ vars.DS_SERVER_URL }}
          PUBLIC_OK: ${{ steps.public.outcome }}
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "## ✅ Datascratch is running"
            else
              echo "## ❌ Deploy failed"
              echo "The previous version keeps running (automatic rollback). Logs: the steps above."
            fi
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Address | https://${DS_DOMAIN:-?} |"
            echo "| Version | \`${DS_TAG}\` |"
            echo "| Mode | ${DS_MODE:-?} (direct — own Caddy on 80/443; edge — behind Sinhron's Caddy; proxy — behind your web server) |"
            echo "| iOS server (variable DS_SERVER_URL) | ${IOS_URL:-not set — set it to https://${DS_DOMAIN:-…}} |"
            if [ "${DS_MODE:-}" = proxy ]; then
              echo
              echo "### Behind your existing proxy"
              echo "Ports 80/443 are used by other software, so Datascratch listens on \`127.0.0.1:${DS_PROXY_PORT}\` only."
              if [ "$PUBLIC_OK" = success ]; then
                echo "The public address already works."
              else
                echo "Connect your proxy to it (infra/DEPLOY.md, «Сервер, на котором уже что-то работает»). Ready config for nginx:"
                echo
                echo '```nginx'
                infra/deploy/remote.sh snippet 2> /dev/null || echo "# (could not read /opt/datascratch/proxy/nginx.conf)"
                echo '```'
                echo "Also on the server: /opt/datascratch/proxy/Caddyfile and traefik.yml."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
