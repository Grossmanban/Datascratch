name: ios-core

# DSCore (apps/ios/Packages/DSCore): yrs-ffi (Rust/UniFFI) → xcframework → Swift package
# tests on an iPad simulator (iOS 26), plus Yrs ↔ Yjs compatibility checks.

on:
  push:
    branches: [main, claude/ios-core]
    paths:
      - apps/ios/Packages/DSCore/**
      - packages/test-vectors/**
      - .github/workflows/ios-core.yml
  pull_request:
    paths:
      - apps/ios/Packages/DSCore/**
      - packages/test-vectors/**
      - .github/workflows/ios-core.yml
  workflow_dispatch:

concurrency:
  group: ios-core-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/ios/Packages/DSCore

jobs:
  rust:
    name: yrs-ffi (Rust tests, Yjs compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ios/Packages/DSCore/yrs-ffi
      - name: cargo test
        working-directory: apps/ios/Packages/DSCore/yrs-ffi
        run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Yjs reads documents written by yrs-ffi
        working-directory: apps/ios/Packages/DSCore/yrs-ffi/compat
        run: npm ci --no-audit --no-fund && node verify.mjs
      - name: Generated Swift bindings are up to date
        run: |
          ./scripts/generate-bindings.sh
          git diff --exit-code -- Sources/YrsFFI Sources/yrs_ffiFFI

  ios:
    name: DSCore tests (iPad simulator, iOS 26)
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write # publishes the yrs_ffiFFI.xcframework release
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ios/Packages/DSCore/yrs-ffi
      - name: Build yrs_ffiFFI.xcframework
        run: ./scripts/build-xcframework.sh
      - name: Pick an iPad simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in data if "iOS-26" in r), reverse=True)
          for r in runtimes:
              for d in data[r]:
                  if d["name"].startswith("iPad"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("no iPad simulator with iOS 26")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - name: xcodebuild test
        run: |
          xcodebuild -list
          set -o pipefail
          xcodebuild test \
            -scheme DSCore \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log | grep -E "error:|warning:|Test Suite|Test Case|✔|✘|passed|failed|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - name: Benchmarks (spec/11 targets, informational)
        continue-on-error: true
        run: |
          set -o pipefail
          TEST_RUNNER_DS_BENCH=1 xcodebuild test \
            -scheme DSCore \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Release ENABLE_TESTABILITY=YES \
            -only-testing:DSCoreTests/BenchmarkTests \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee bench.log | grep -E "BENCH|✘|\*\* TEST" || true
          grep "BENCH" bench.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish yrs_ffiFFI.xcframework release
        # Consumers (DSEditor, the app) download the binary instead of building Rust.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/ios-core')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="yrs-ffi-$(./scripts/yrs-ffi-hash.sh)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            (cd build && ditto -c -k --sequesterRsrc --keepParent yrs_ffiFFI.xcframework yrs_ffiFFI.xcframework.zip)
            CHECKSUM=$(swift package compute-checksum build/yrs_ffiFFI.xcframework.zip)
            gh release create "$TAG" build/yrs_ffiFFI.xcframework.zip --target "$GITHUB_SHA" --prerelease \
              --title "$TAG" --notes "yrs_ffiFFI.xcframework for DSCore (yrs-ffi sources hash ${TAG#yrs-ffi-}). SwiftPM checksum: $CHECKSUM"
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/yrs_ffiFFI.xcframework.zip"
          CHECKSUM=$(gh release view "$TAG" --json body -q .body | sed -n 's/.*SwiftPM checksum: \([0-9a-f]*\).*/\1/p')
          echo "### yrs_ffiFFI.xcframework" >> "$GITHUB_STEP_SUMMARY"
          echo "url: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "checksum: $CHECKSUM" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$URL checksum=$CHECKSUM"
          if ! grep -q "$TAG" Package.swift; then
            echo "::warning::Package.swift does not pin $TAG yet (update yrsRelease url/checksum)"
          fi
      - name: Pinned release resolves (what DSEditor and the app use)
        run: |
          TAG="yrs-ffi-$(./scripts/yrs-ffi-hash.sh)"
          if grep -q "$TAG" Package.swift; then
            mv build/yrs_ffiFFI.xcframework build/local.xcframework
            swift package resolve
            mv build/local.xcframework build/yrs_ffiFFI.xcframework
          else
            echo "::warning::Package.swift pins an older yrs-ffi release than $TAG"
          fi
      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: apps/ios/Packages/DSCore/xcodebuild.log
