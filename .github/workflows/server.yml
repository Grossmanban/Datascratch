name: server

on:
  push:
    branches: [main, claude/server]
    paths:
      - apps/server/**
      - apps/web/**
      - packages/**
      - infra/**
      - pnpm-lock.yaml
      - .github/workflows/server.yml
      - .github/workflows/deploy.yml
  pull_request:
    paths:
      - apps/server/**
      - apps/web/**
      - packages/**
      - infra/**
      - pnpm-lock.yaml
      - .github/workflows/server.yml
      - .github/workflows/deploy.yml

# Least privilege: jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ds
          POSTGRES_PASSWORD: ds
          POSTGRES_DB: ds_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ds -d ds_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ds:ds@localhost:5432/ds_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (server and its workspace dependencies)
        run: pnpm --filter "@datascratch/server..." run build
      - name: Typecheck
        run: pnpm --filter @datascratch/server run typecheck
      - name: Lint
        run: pnpm --filter @datascratch/server run lint
      - name: Migrations match the schema
        working-directory: apps/server
        run: |
          pnpm exec drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts changed without a migration (run pnpm db:generate)"; git status --porcelain drizzle; exit 1
          fi
      - name: Test (vitest + PostgreSQL)
        run: pnpm --filter @datascratch/server run test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile
          tags: datascratch-server:latest
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose smoke test (start, backup, wipe, restore)
        working-directory: infra
        run: |
          cp .env.example .env
          secret() { openssl rand -base64 32 | tr '+/' '-_' | tr -d '='; }
          sed -i "s/^DS_JWT_SECRET=.*/DS_JWT_SECRET=$(secret)/; s/^DS_KMS_KEY=.*/DS_KMS_KEY=$(secret)/; s/^NODE_ENV=.*/NODE_ENV=production/" .env
          ./smoke-test.sh
      - name: Logs on failure
        if: failure()
        working-directory: infra
        run: docker compose logs --tail 200

  deploy-e2e:
    name: Deploy scripts end to end (simulated Ubuntu 24.04 VPS)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color .github/workflows/deploy.yml .github/workflows/server.yml
      - name: shellcheck
        run: shellcheck -S warning infra/deploy/*.sh infra/deploy/test/*.sh infra/*.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile
          tags: datascratch-server:latest
          load: true
          cache-from: type=gha,scope=server
      - name: Web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/deploy/web.Dockerfile
          tags: datascratch-web:latest
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap, deploy, redeploy, automatic and manual rollback, backup
        run: infra/deploy/test/e2e.sh
