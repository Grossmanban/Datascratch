name: EditorDemo
options:
  bundleIdPrefix: com.datascratch.app
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  DSEditor:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  EditorDemo:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: DSEditor
        product: DSEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datascratch.app.editordemo
        PRODUCT_NAME: EditorDemo
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Перо — демо"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  EditorDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UnitTests]
    dependencies:
      - target: EditorDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datascratch.app.editordemo.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  EditorDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: EditorDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datascratch.app.editordemo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: EditorDemo
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  EditorDemo:
    build:
      targets:
        EditorDemo: all
    test:
      targets:
        - EditorDemoTests
        - EditorDemoUITests
