      [data-boot="draw"] .ds-boot-body{opacity:0}
      [data-boot="draw"] .ds-boot-wet{opacity:.45}
      [data-theme="dark"] .ds-boot-bg{background:#1a1917}
      [data-theme="dark"] .ds-boot-tile{fill:#22211e}
      [data-theme="dark"] .ds-boot-edge{stroke:#34322e}
      [data-theme="dark"] .ds-boot-ink{fill:#7b9bff}
      [data-theme="dark"] .ds-boot-nib{background:#7b9bff;box-shadow:0 0 0 3px rgba(123,155,255,.2)}
    </style>
