# Production stack installed by the deploy workflow into /opt/datascratch.
# Images come from GHCR; the tag and the domain are written by deploy.sh into
# the managed block of .env (secrets in .env are generated once on the server).
name: datascratch

services:
  # Every image comes from GHCR: the server never pulls from Docker Hub.
  # Memory limits come from deploy.sh (smaller on a server shared with other apps).
  # Everything (containers, volumes, network) is prefixed by the project name.
  postgres:
    image: ${DS_POSTGRES_IMAGE:-ghcr.io/grossmanban/datascratch-postgres:16-alpine}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=${DS_PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${DS_PG_CACHE_SIZE:-1GB}
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    deploy:
      resources:
        limits:
          memory: ${DS_MEM_POSTGRES:-1g}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datascratch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:-datascratch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 128mb

  server:
    image: ${DS_SERVER_IMAGE:-ghcr.io/grossmanban/datascratch-server}:${DS_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-datascratch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datascratch}
      STORAGE_DIR: /data/files
      PORT: 8080
      PUBLIC_URL: https://${DS_DOMAIN:-localhost}
      APP_URL: https://${DS_DOMAIN:-localhost}
      DS_VERSION: ${DS_TAG:-latest}
      # claude.ai is unreachable from some server regions; MCP clients then register dynamically.
      OAUTH_CLIENT_METADATA_DOCUMENTS: ${DS_OAUTH_CLIENT_METADATA_DOCUMENTS:-false}
      NODE_OPTIONS: --max-old-space-size=${DS_NODE_HEAP_MB:-768}
    deploy:
      resources:
        limits:
          memory: ${DS_MEM_SERVER:-1g}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - files:/data/files

  # The web app + Caddy. Fixed name: an existing reverse proxy on the shared `edge`
  # network reaches it as datascratch-web:80 (mode "edge", docker-compose.edge.yml).
  web:
    image: ${DS_WEB_IMAGE:-ghcr.io/grossmanban/datascratch-web}:${DS_TAG:-latest}
    container_name: datascratch-web
    restart: unless-stopped
    environment:
      DS_DOMAIN: ${DS_DOMAIN:-localhost}
      # Direct mode: the domain (Caddy gets the certificate). Behind an existing proxy:
      # plain HTTP on 127.0.0.1 only; the existing proxy terminates TLS.
      DS_SITE: ${DS_SITE:-localhost}
    deploy:
      resources:
        limits:
          memory: ${DS_MEM_CADDY:-256m}
    ports:
      - "${DS_PORT_HTTP:-80:80}"
      - "${DS_PORT_HTTPS:-443:443}"
      - "${DS_PORT_HTTPS_UDP:-443:443/udp}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
